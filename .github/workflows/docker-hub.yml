name: Publish Docker Hub image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .github/workflows/docker-hub.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-hub

env:
  IMAGE: docker.io/hengxin007/webui-for-singbox

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Build image for smoke testing
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: webui-for-singbox:smoke
          cache-from: type=gha,scope=docker-hub
          cache-to: type=gha,mode=max,scope=docker-hub

      - name: Run the official glibc and musl sing-box releases
        run: |
          version=1.14.2
          for libc in glibc musl; do
            asset="sing-box-$version-linux-amd64-$libc"
            curl -fsSL --retry 3 \
              "https://github.com/SagerNet/sing-box/releases/download/v$version/$asset.tar.gz" \
              -o "$RUNNER_TEMP/$asset.tar.gz"
            tar -xzf "$RUNNER_TEMP/$asset.tar.gz" -C "$RUNNER_TEMP" "$asset/sing-box"
            docker run --rm \
              --mount "type=bind,source=$RUNNER_TEMP/$asset/sing-box,target=/tmp/sing-box,readonly" \
              --entrypoint /tmp/sing-box webui-for-singbox:smoke version
          done

      - name: Check that the WebUI starts
        run: |
          container="$(docker run --detach --publish 127.0.0.1:9090:9090 webui-for-singbox:smoke)"
          trap 'docker rm --force --volumes "$container" >/dev/null' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9090/api/app/start-time >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$container"
          exit 1

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: hengxin007
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish the multi-platform image
        id: publish
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=docker-hub
          cache-to: type=gha,mode=max,scope=docker-hub
          provenance: false

      - name: Verify published platforms
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$IMAGE@$DIGEST" --raw | jq -e '
            any(.manifests[].platform; .os == "linux" and .architecture == "amd64") and
            any(.manifests[].platform; .os == "linux" and .architecture == "arm64") and
            any(.manifests[].platform; .os == "linux" and .architecture == "arm" and .variant == "v7")
          '
